# Сверка данных документов без ссылки на норматив.

- id: cross-check-rpd-semesters-sum-to-total
  title: Трудоёмкость по семестрам даёт итог таблицы трудоёмкости
  rule_set: cross_check
  applies_to: course
  doc_kinds: [discipline, practice]
  method: code
  check: semesters_sum_to_total
  severity: error
  fixable: true


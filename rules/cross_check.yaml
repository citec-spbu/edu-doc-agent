- id: cross-check-rpd-goals-vs-outcomes
  title: Цели и результаты обучения соответствуют месту дисциплины в программе
  rule_set: cross_check
  applies_to: course
  doc_kinds: [discipline]
  method: llm
  criterion: >-
    Цели (раздел 1.1) и результаты обучения (раздел 1.3) соответствуют месту дисциплины в
    программе. Результат обучения на своём месте, если он относится к целям дисциплины или к
    любой компетенции, которую учебный план закрепляет за дисциплиной (формулировки и
    результаты из ЦКМВ — в контексте программы), даже если он совпадает с результатами других
    дисциплин. Нарушение — есть результаты, которые не относятся ни к целям, ни к закреплённым
    компетенциям, или цели называют другую дисциплину.
  fields: [title, goals, learning_outcomes]
  severity: warning
  fixable: false  # смысловое замечание: исправляет человек, автоправка не нужна


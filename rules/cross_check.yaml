- id: cross-check-contradictions
  title: Семестры и часы в РПД не противоречат учебному плану
  rule_set: cross_check
  applies_to: documents
  doc_kinds: [discipline, practice]
  method: llm
  criterion: >-
    Семестры, часы контактной работы по видам занятий и часы самостоятельной работы в таблице
    трудоёмкости РПД не противоречат строкам учебного плана этой дисциплины. Учебный план —
    источник истины: при расхождении верно значение учебного плана, нарушение — в РПД; в
    объяснении назови значение плана как верное. Трудоёмкость в з.е. и коды компетенций
    проверяют другие правила, их расхождения не учитывай.
  fields: [title, workload_table]
  severity: warning
  fixable: true

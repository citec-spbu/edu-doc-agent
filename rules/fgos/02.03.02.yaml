- id: fgos-02.03.02-required-disciplines
  title: В Блоке 1 есть философия, история, иностранный язык и безопасность жизнедеятельности
  rule_set: fgos
  applies_to: program
  doc_kinds: [curriculum]
  method: code
  check: disciplines_present
  params:
    block: Блок.1
    disciplines:
      философия: "философ"
      история: "истори"
      иностранный язык: "иностранн|английск|немецк|французск|испанск|китайск"
      безопасность жизнедеятельности: "безопасност\\w* жизнедеятельност"
  severity: error
  fixable: false
  requirement:
    quote: >-
      Программа бакалавриата должна обеспечивать реализацию дисциплин (модулей) по философии,
      истории (истории России, всеобщей истории), иностранному языку, безопасности
      жизнедеятельности в рамках Блока 1 "Дисциплины (модули)".
    clause_id: "fgos-02.03.02:2.2"
    edition: "808 ред. от 08.02.2021"

- id: fgos-02.03.02-practice-types
  title: Тип практики соответствует типам, установленным ФГОС
  rule_set: fgos
  applies_to: course
  doc_kinds: [practice]
  method: code
  check: practice_type_allowed
  params:
    types:
      технологическая (проектно-технологическая): "технологическ|проектн"
      эксплуатационная: "эксплуатацион"
      научно-исследовательская работа: "научно-исследовательск"
  severity: error
  fixable: true
  requirement:
    quote: |-
      Типы учебной практики:
      технологическая (проектно-технологическая) практика;
      эксплуатационная практика;
      научно-исследовательская работа (получение первичных навыков научно-исследовательской работы).
      Типы производственной практики:
      технологическая (проектно-технологическая) практика;
      эксплуатационная практика;
      научно-исследовательская работа.
    clause_id: "fgos-02.03.02:2.4"
    edition: "808 ред. от 08.02.2021"


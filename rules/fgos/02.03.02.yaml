    prefixes: [УК]
    codes: [УК-1, УК-2, УК-3, УК-4, УК-5, УК-6, УК-7, УК-8, УК-9, УК-10]
  severity: error
  fixable: true
  requirement:
    quote: "Программа бакалавриата должна устанавливать следующие универсальные компетенции:"
    clause_id: "fgos-02.03.02:3.2"
    edition: "808 ред. от 08.02.2021"


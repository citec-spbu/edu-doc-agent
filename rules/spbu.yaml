- id: spbu-plan-blocks
  title: В учебном плане есть блоки «Дисциплины», «Практика» и «ГИА»
  rule_set: spbu
  applies_to: program
  doc_kinds: [curriculum]
  method: code
  check: plan_blocks_present
  params:
    blocks:
      Блок 1 «Дисциплины (модули)»: "Блок.1"
      Блок 2 «Практика»: "Блок.2"
      Блок 3 «Государственная итоговая аттестация»: "Блок.3"
  severity: error
  fixable: false
  requirement:
    quote: "Структура образовательной программы включает следующие блоки:"
    clause_id: "spbu-os:2.3"
    edition: "11144/1 от 24.08.2026"

# Ручные правки корпуса нормативов (накладываются после нарезки, исходные файлы не трогаем).
# Ключ — doc_id. replace: id -> текст или поля {text, group, path}; add: новые фрагменты; drop: id.

spbu-os:
  # Приложение к ОС СПбГУ — таблица без рамок, автоматически не разбирается.
  # Тексты УКБ восстановлены из PDF — ПРОВЕРИТЬ по оригиналу приказа.
  # Для магистратуры (УКМ-1..4) и специалитета (УКС) — добавить так же.
  add:
    - id: spbu-os:app:УКБ-1
      kind: competency
      number: app
      path: Приложение к Образовательному стандарту СПбГУ › УКБ-1
      group: Исследовательская и (или) предпринимательская активность
      text: >-
        УКБ-1: Способен участвовать в разработке и реализации проектов,
        в т.ч. предпринимательских
    - id: spbu-os:app:УКБ-2
      kind: competency
      number: app
      path: Приложение к Образовательному стандарту СПбГУ › УКБ-2
      group: Социально-ответственное поведение и сотрудничество
      text: >-
        УКБ-2: Способен устанавливать и поддерживать взаимоотношения в социальной
        и профессиональной сфере, исходя из нетерпимости к коррупционному поведению
        и проявлениям экстремизма, учитывать культурно-исторический опыт России,
        содействовать сохранению и укреплению традиционных российских
        духовно-нравственных ценностей
    - id: spbu-os:app:УКБ-3
      kind: competency
      number: app
      path: Приложение к Образовательному стандарту СПбГУ › УКБ-3
      group: Работа с информацией
      text: >-
        УКБ-3: Способен понимать сущность и значение информации в развитии общества,
        использовать основные методы получения и работы с информацией с учетом
        современных технологий цифровой экономики, искусственного интеллекта и науки
        о данных, а также информационной безопасности
    - id: spbu-os:app:УКБ-4
      kind: competency
      number: app
      path: Приложение к Образовательному стандарту СПбГУ › УКБ-4
      group: Инклюзивная компетенция (для программ по ФГОС, утвержденным до 2020 года)
      text: >-
        УКБ-4: Способен использовать базовые дефектологические знания в социальной
        и профессиональной сферах

